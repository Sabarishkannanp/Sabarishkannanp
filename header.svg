<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Sabarish Kannan P - MERN Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#47A248"/>
      <stop offset="0.5" stop-color="#61DAFB"/>
      <stop offset="1" stop-color="#c084fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="c1">
      <rect x="285" y="140" height="40" width="0">
        <animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.1;0.30;0.31;1" values="0;330;330;0;0"/>
      </rect>
    </clipPath>
    <clipPath id="c2">
      <rect x="278.4" y="140" height="40" width="0">
        <animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.3333;0.4333;0.6333;0.6433;1" values="0;0;343.2;343.2;0;0"/>
      </rect>
    </clipPath>
    <clipPath id="c3">
      <rect x="238.8" y="140" height="40" width="0">
        <animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.6667;0.7667;0.97;0.98;1" values="0;0;422.4;422.4;0;0"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <!-- floating particles -->
  <g fill="#61DAFB">
    <circle cx="80" cy="250" r="2"><animate attributeName="cy" values="250;10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="250" r="1.5"><animate attributeName="cy" values="250;10" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="250" r="2.5"><animate attributeName="cy" values="250;10" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="250" r="1.5"><animate attributeName="cy" values="250;10" dur="10s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="250" r="2"><animate attributeName="cy" values="250;10" dur="7.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="250" r="2.5"><animate attributeName="cy" values="250;10" dur="9s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- waves -->
  <path fill="#47A248" fill-opacity="0.35" d="M0,215 C150,185 300,245 450,215 S750,185 900,215 L900,260 L0,260 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0,215 C150,185 300,245 450,215 S750,185 900,215 L900,260 L0,260 Z;M0,215 C150,245 300,185 450,215 S750,245 900,215 L900,260 L0,260 Z;M0,215 C150,185 300,245 450,215 S750,185 900,215 L900,260 L0,260 Z"/>
  </path>
  <path fill="#61DAFB" fill-opacity="0.25" d="M0,230 C150,210 300,250 450,230 S750,210 900,230 L900,260 L0,260 Z">
    <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0,230 C150,250 300,210 450,230 S750,250 900,230 L900,260 L0,260 Z;M0,230 C150,210 300,250 450,230 S750,210 900,230 L900,260 L0,260 Z;M0,230 C150,250 300,210 450,230 S750,250 900,230 L900,260 L0,260 Z"/>
  </path>

  <!-- intro line -->
  <text x="450" y="58" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="7" fill="#8b949e" opacity="0">
    HELLO WORLD, I'M
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>

  <!-- name with moving gradient -->
  <text x="450" y="115" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="800" fill="url(#name)" opacity="0">
    Sabarish Kannan P
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- typing phrases -->
  <g font-family="'Courier New', Consolas, Menlo, monospace" font-size="22" fill="#e6edf3">
    <text x="285" y="165" textLength="330" lengthAdjust="spacing" clip-path="url(#c1)">MERN Full Stack Developer</text>
    <text x="278.4" y="165" textLength="343.2" lengthAdjust="spacing" clip-path="url(#c2)">Building scalable web apps</text>
    <text x="238.8" y="165" textLength="422.4" lengthAdjust="spacing" clip-path="url(#c3)">Always learning, always shipping</text>
  </g>

  <!-- cursors following the typing -->
  <rect x="285" y="144" width="3" height="26" fill="#61DAFB">
    <animate attributeName="x" dur="15s" repeatCount="indefinite" keyTimes="0;0.1;0.30;0.31;1" values="285;615;615;285;285"/>
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3333;1" values="1;0;0"/>
  </rect>
  <rect x="278.4" y="144" width="3" height="26" fill="#61DAFB" opacity="0">
    <animate attributeName="x" dur="15s" repeatCount="indefinite" keyTimes="0;0.3333;0.4333;0.6333;0.6433;1" values="278.4;278.4;621.6;621.6;278.4;278.4"/>
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3333;0.6666;1" values="0;1;0;0"/>
  </rect>
  <rect x="238.8" y="144" width="3" height="26" fill="#61DAFB" opacity="0">
    <animate attributeName="x" dur="15s" repeatCount="indefinite" keyTimes="0;0.6667;0.7667;0.97;0.98;1" values="238.8;238.8;661.2;661.2;238.8;238.8"/>
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6666;1" values="0;1;1"/>
  </rect>
</svg>
